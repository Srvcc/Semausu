databases:
  - name: semausu-postgres
    databaseName: semausu
    user: semausu
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: semausu
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://semausu.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: semausu-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_PORTAL_PATH
        sync: false
      - key: PLATFORM_PORTAL_PATH
        sync: false
      - key: PLATFORM_OWNER_NAME
        value: Solomon Itumeleng
      - key: PLATFORM_OWNER_EMAIL
        value: solomonitumeleng143@gmail.com
      - key: PLATFORM_OWNER_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: solomonitumeleng143@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Semausu <solomonitumeleng143@gmail.com>
